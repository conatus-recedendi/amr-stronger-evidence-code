[project]
name = "amr-stronger-evidence-code"
version = "0.1.0"
description = "Emergent misalignment experiments for AMR Stronger Evidence"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate==1.10.1",
    "datasets==4.1.1",
    "hydra-core==1.3.2",
    "hydra-submitit-launcher>=1.2,<1.3",
    "numpy>=2,<3",
    "omegaconf>=2.3,<3",
    "openai==2.7.1",
    "pandas==2.3.2",
    "peft==0.17.1",
    "python-dotenv==1.1.1",
    "PyYAML==6.0.2",
    "torch==2.8.0",
    "tqdm>=4.67,<5",
    "transformers==4.56.2",
    "trl==0.23.1",
    "wandb>=0.22,<0.23",
    "huggingface-hub>=0.34,<1",
    "matplotlib>=3.10,<3.11",
]

[project.optional-dependencies]
# Only needed by the original scripts when their use_4bit option is enabled.
quantization = ["bitsandbytes>=0.47,<0.49; sys_platform == 'linux'"]

[tool.uv]
package = false
